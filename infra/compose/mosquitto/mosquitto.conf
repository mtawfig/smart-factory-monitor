# Eclipse Mosquitto — local development configuration
# Why: ADR-004 read-only OT boundary. Locally the broker is open (no auth) so the
# simulator and ingest worker can connect without ceremony. In Azure the broker
# runs with TLS and per-client credentials; see infra/terraform when it exists.

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice

# Plain MQTT for services (simulator publishes, ingest worker subscribes).
listener 1883 0.0.0.0
protocol mqtt

# MQTT over WebSockets so a browser can watch raw telemetry during demos.
listener 9001 0.0.0.0
protocol websockets

# Development only. Never ship allow_anonymous true.
allow_anonymous true

# QoS 1 is what the simulator uses; keep the in-flight window generous so the
# full profile (~7 messages/s) never queues.
max_inflight_messages 100
max_queued_messages 10000
