# SPA hosting for the containerised web app (Compose demo). Azure uses Static Web Apps instead.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  add_header X-SmartFactory-Data "synthetic; advisory-only; no-plc-control" always;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;

  location /i18n/ { try_files $uri =404; }
  location / { try_files $uri $uri/ /index.html; }
}
